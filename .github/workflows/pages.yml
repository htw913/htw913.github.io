name: Publish personal portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s project.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s assets/data.js
          test -s assets/motion.js
          test -s assets/scene3d.js
          node --check assets/app.js
          node --check assets/motion.js
          node --check assets/scene3d.js
          node --check assets/data.js
          ! grep -RqE 'http://localhost|file:///|YOUR_API_KEY' index.html project.html assets
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
